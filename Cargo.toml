[package]
name = "about-this-app"
version = "27.0.0"
edition = "2021"
description = "About window for TontooOS .app bundles"
readme = "README.md"

[[bin]]
name = "about-this-app"
path = "src/main.rs"

[dependencies]
# TontooOS SDK: frameworks via features (on-device: /Library/System/sdk).
sdk = { path = "/Library/System/sdk", features = ["TontooUI", "CoreIcon", "Foundation", "Accessibility", "ArchiveKit"] }
vello = "0.10"
